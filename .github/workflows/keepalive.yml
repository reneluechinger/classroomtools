name: Supabase wachhalten

# Gratis-Projekte bei Supabase pausieren nach 7 Tagen ohne Aktivität (z.B. in den Ferien).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank anpingen
        run: |
          URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          curl -sf -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
